<!--
  Gallery template "grid" (Сетка).
  Edit freely: this file is yours and is never overwritten by an update of TipTapEditor.
  Before "item": the outer element of the gallery, {items} is where the pictures go.
  To rename it in the dialog, add a comment starting with "label:", for example "label: My grid".
  After "item": one picture. {image} is the picture (with the "open larger" link when it is on),
  {caption} is <figcaption> with the caption (leave it out to hide the caption field).
-->
<div class="gallery">{items}</div>
<!-- item -->
<figure class="gallery__item">{image}{caption}</figure>
