<!--
  Gallery template "images" (Только изображения): the pictures and videos without captions.
  Edit freely: this file is yours and is never overwritten by an update of TipTapEditor.
  Before "item": the outer element of the gallery, {items} is where the pictures and videos go.
  To rename it in the dialog, add a comment starting with "label:", for example "label: My grid".
  After "item": one picture or video, {image} (a picture with the "open larger" link when it is on,
  a video as <video> or <iframe>).
-->
<div class="gallery gallery--images">{items}</div>
<!-- item -->
{image}
