<!--
  Gallery template "images" (Только изображения): the pictures without captions.
  Edit freely: this file is yours and is never overwritten by an update of TipTapEditor.
  Before "item": the outer element of the gallery, {items} is where the pictures go.
  The outer element needs a class: the editor knows the gallery by it.
  To rename it in the dialog, add a comment starting with "label:", for example "label: My grid".
  After "item": one picture, {image} (with the "open larger" link when it is on).
-->
<div class="gallery gallery--images">{items}</div>
<!-- item -->
{image}
