name: Documentation

# Builds the documentation site on every push and pull request; publishes it to GitHub Pages
# from main. One-time setup: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/docs-generate.php', '_build/elements/settings.php', 'core/components/tiptapeditor/lexicon/**', 'core/components/tiptapeditor/docs/changelog.txt', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'scripts/docs-generate.php', '_build/elements/settings.php', 'core/components/tiptapeditor/lexicon/**', 'core/components/tiptapeditor/docs/changelog.txt', 'package.json', 'package-lock.json', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # "last updated" dates come from git history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: npm ci
      - run: npm run docs:build
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
